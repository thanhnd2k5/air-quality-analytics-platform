# Phase 2 infrastructure: PostgreSQL + MinIO + Airflow (LocalExecutor)
# Network name matches ARCHITECTURE.md §38: air-quality-network
#
# Note (2026-09): official `minio/minio` was removed from Docker Hub.
# Using community image `coollabsio/minio` (built from MinIO source).

x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.10.5}
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/airflow_db
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES:-false}
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Project package at /opt/airflow/src → import src.* (ARCHITECTURE: DAG → modules)
    PYTHONPATH: /opt/airflow
    # Inside the compose network use service DNS, not localhost
    MINIO_ENDPOINT: minio:9000
    # Client creds must match the MinIO server root user (MINIO_ROOT_*)
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    MINIO_BUCKET: ${MINIO_BUCKET:-air-quality-lake}
    MINIO_SECURE: ${MINIO_SECURE:-false}
    UCI_RAW_DIR: /opt/airflow/data/raw/uci
    UCI_INVENTORY_PATH: /opt/airflow/data/raw/reference/file_inventory.csv
    # Install minio only on long-running services (not airflow-init which runs as root)
    _PIP_ADDITIONAL_REQUIREMENTS: ""
  volumes:
    - ${AIRFLOW_PROJ_DIR:-./airflow}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-./airflow}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-./airflow}/plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/src
    # Phase 3 (P3-03): local UCI CSVs + inventory for ingestion (read-only)
    - ./data/raw:/opt/airflow/data/raw:ro
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - air_quality_network
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  # --------------------------------------------------------------------------
  # PostgreSQL: warehouse DB (air_quality_dw) + Airflow metadata (airflow_db)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: air_quality_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-air_quality_dw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - air_quality_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-air_quality_dw}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # MinIO: Data Lake (bucket air-quality-lake — see config/minio/bucket_layout.md)
  # --------------------------------------------------------------------------
  minio:
    image: coollabsio/minio:latest
    container_name: air_quality_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - air_quality_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # Airflow: one-shot metadata migrate + admin user (P2-18)
  # --------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: air_quality_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, export AIRFLOW_UID=\$$(id -u) before docker compose up"
          echo
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        echo "Airflow init: $${cpus_available} CPUs, $${mem_available} MB RAM, $${disk_available} KB disk free"
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "${AIRFLOW_UID}:0" /sources/{logs,dags,plugins}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin}
    user: "0:0"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-./airflow}:/sources

  # --------------------------------------------------------------------------
  # Airflow webserver (P2-19) — UI :8080
  # --------------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: air_quality_airflow_webserver
    command: webserver
    environment:
      <<: *airflow-common-env
      _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-minio>=7.1.15}
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # --------------------------------------------------------------------------
  # Airflow scheduler (P2-20) — LocalExecutor runs tasks in-process
  # --------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: air_quality_airflow_scheduler
    command: scheduler
    environment:
      <<: *airflow-common-env
      _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-minio>=7.1.15}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  air_quality_network:
    name: air-quality-network
    driver: bridge
