# Phase 2 infrastructure: PostgreSQL + MinIO (+ Airflow in P2-17+)
# Network name matches ARCHITECTURE.md §38: air-quality-network
#
# Note (2026-09): official `minio/minio` was removed from Docker Hub.
# Using community image `coollabsio/minio` (built from MinIO source).

services:
  # --------------------------------------------------------------------------
  # PostgreSQL: warehouse DB (air_quality_dw) + Airflow metadata (airflow_db)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: air_quality_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-air_quality_dw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - air_quality_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-air_quality_dw}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # MinIO: Data Lake (bucket air-quality-lake — see config/minio/bucket_layout.md)
  # --------------------------------------------------------------------------
  minio:
    image: coollabsio/minio:latest
    container_name: air_quality_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - air_quality_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # Airflow webserver / scheduler — added in P2-17+
  # --------------------------------------------------------------------------

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  air_quality_network:
    name: air-quality-network
    driver: bridge
