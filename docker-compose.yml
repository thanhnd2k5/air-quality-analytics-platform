version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL: Staging schema and Data Warehouse
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: air_quality_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-air_quality_dwh}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - air_quality_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-air_quality_dwh}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # MinIO: Local S3 Object Storage / Data Lake
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: air_quality_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - air_quality_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------------------------
  # (Khung dịch vụ Airflow & Dashboard sẽ hoàn thiện ở các Phase tiếp theo)
  # ----------------------------------------------------------------------------

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  air_quality_network:
    driver: bridge
