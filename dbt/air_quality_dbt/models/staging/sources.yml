version: 2

sources:
  - name: staging
    description: PostgreSQL staging loaded from processed Parquet and stations.csv (Phase 6). Not the dimensional warehouse.
    schema: staging
    tables:
      - name: air_quality_hourly
        description: 1:1 UCI processed hourly. Grain is station_name + event_time_local. UCI weather stays on this table.
      - name: weather_openmeteo_hourly
        description: 1:1 Open-Meteo processed hourly (om_* columns, including cloud cover).
      - name: station_reference
        description: Station seed from data/raw/reference/stations.csv.
      - name: pm25_predictions_raw
        description: >
          Phase 10d locked-model predictions loaded by
          scripts/run_forecasting_phase10d.py (COPY from
          artifacts/forecasting/predictions_locked.parquet). Grain:
          station_key + prediction_origin_time.
      - name: pm25_alert_predictions_raw
        description: >
          Locked alert classifier output (PM2.5(t+1) >= 115) loaded by
          scripts/run_all.py / src.classification.persist from
          artifacts/classification/predictions.parquet. Grain:
          station_key + prediction_origin_time.
