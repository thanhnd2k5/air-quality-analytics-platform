name: air_quality_dbt
version: "1.0.0"
config-version: 2
profile: air_quality_dbt

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages
  - logs

# Phase 8c locked episode definition (see artifacts/eda/episode_definition.md)
vars:
  pm25_episode_threshold: 115
  pm25_episode_min_hours: 3
  pm25_multi_station_k: 6

models:
  air_quality_dbt:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: staging
      +materialized: view
    warehouse:
      +schema: dwh
      +materialized: table
    marts:
      +schema: mart
      +materialized: table
